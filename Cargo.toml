[package]
name = "mujmap"
description = "JMAP integration for notmuch mail"
authors = ["Eliza Velasquez"]
version = "0.2.0"
license = "GPL-3.0"
keywords = ["notmuch", "mail", "email", "jmap"]
categories = ["command-line-utilities", "email"]
repository = "https://github.com/elizagamedev/mujmap/"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
atty = "0.2.14"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive", "cargo"] }
clap-verbosity-flag = "3.0.4"
const_format = "0.2.37"
directories = "6.0.0"
either = "1.19.0"
email-parser = "0.5.0"
env_logger = "0.11.12"
fqdn = "0.5.2"
fslock = "0.2.1"
indicatif = "0.18.6"
itertools = "0.15.0"
lazy_static = "1.5.1"
loe = "0.3.0"
log = "0.4.35"
notmuch = "0.8.1"
rayon = "1.12.0"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snafu = "0.9.2"
symlink = "0.1.0"
termcolor = "1.4.1"
toml = "1.2.2"
trust-dns-resolver = "0.23.2"
ureq = { version = "2.12", features = ["json"] }
uritemplate-next = "0.2.0"
